<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ếch Thổ Phỉ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600;800&family=Baloo+2:wght@600;800&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ph:0px;--st:0px}
html,body{margin:0;height:100%;background:#1a120b;color:#fff;font-family:'Be Vietnam Pro','Baloo 2','Cairo',system-ui,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#sa{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);pointer-events:none}
#wrap{position:fixed;left:0;right:0;top:var(--st);bottom:var(--ph);display:flex;align-items:center;justify-content:center}
#stage{position:relative;box-shadow:0 0 40px #000}
canvas{width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(26,16,8,.72);backdrop-filter:blur(2px);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#ov.hide{display:none}
.panel{width:min(92%,740px);max-height:92%;overflow:auto;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 3px,transparent 3px 13px),linear-gradient(180deg,#6b4423,#3d2512);border:4px solid #c8a165;border-radius:18px;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 0 3px #3b2410;text-align:center;box-sizing:border-box}
h1{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(26px,5.4vw,50px);color:#ffcf6b;text-shadow:3px 3px 0 #8a3b12,6px 6px 0 #1a0f06;letter-spacing:1px}
h2{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;font-weight:400;margin:0 0 8px;color:#ffcf6b;font-size:clamp(20px,3.6vw,32px);text-shadow:2px 2px 0 #1a0f06}
.sub{margin:6px 0 12px;color:#f3e2c0;font-size:15px}
.info{background:rgba(26,15,6,.55);border-radius:10px;padding:8px 12px;margin:10px 0;color:#f0e0c0;font-size:14px}
.info b{color:#ffd166}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-size:13px;text-align:left}
.keys div{background:rgba(26,15,6,.55);border-radius:8px;padding:7px 10px;color:#ead8b4}
kbd{display:inline-block;min-width:18px;text-align:center;background:#efe4cc;border:1px solid #8a7a5a;border-bottom-width:3px;border-radius:6px;padding:1px 6px;margin-right:6px;color:#2b2119;font-family:inherit;font-weight:800}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;font-size:15px;padding:11px 20px;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#4d3520,#33220f);color:#f3e2c0;border:1px solid rgba(255,207,107,.35);box-shadow:0 3px 0 #140b04,0 6px 14px rgba(0,0,0,.3);letter-spacing:.02em;transition:transform .07s,filter .07s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #140b04}
button.pri{background:linear-gradient(180deg,#ffc06a,#e8772a);color:#2a1406;border-color:#ffd99a;box-shadow:0 3px 0 #7a3a0a,0 6px 16px rgba(232,119,42,.35)}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:default;filter:none}
.scenes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 2px}
.scenes button{font-size:12.5px;padding:8px 13px}
.lgb{display:inline-flex;align-items:center;gap:7px}.flag{display:inline-block;width:24px;height:16px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35)}.flag svg{width:100%;height:100%;display:block}
.regions.one{grid-template-columns:1fr}.bigcard{height:96px!important}.bigcard span{font-size:12px;line-height:1.3}.bigcard small{font-family:'Be Vietnam Pro','Baloo 2','Cairo',sans-serif;font-size:11px;opacity:.95}
[dir=rtl] .grp,[dir=rtl] .regions button span{text-align:right}[dir=rtl] .regions button{justify-content:flex-end}
.trackcard{display:block;position:relative;width:100%;height:170px;padding:0;margin:6px 0 4px;border-radius:14px;overflow:hidden;border:3px solid #ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.3),0 6px 16px rgba(0,0,0,.35);background:#2a1c10;cursor:pointer}
.trackcard svg{position:absolute;inset:0;width:100%;height:100%}
.tcname{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;text-align:left;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff;text-shadow:0 1px 2px #000;display:flex;flex-direction:column;gap:2px;font-size:14px}
.tcname small{font-family:'Be Vietnam Pro','Baloo 2','Cairo',sans-serif;font-size:11.5px;opacity:.95;line-height:1.3}
.tctap{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#ffd166;font-size:11px;padding:4px 9px;border-radius:10px;font-family:'Be Vietnam Pro','Baloo 2','Cairo',sans-serif;font-weight:800}
[dir=rtl] .tcname{text-align:right}[dir=rtl] .tctap{right:auto;left:8px}
.ltop{display:flex;justify-content:flex-start;direction:ltr;margin:-6px 0 4px;position:relative;z-index:3}
.ldrop{position:relative}
.ldbtn{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;font-size:12px;font-family:'Be Vietnam Pro','Baloo 2','Cairo',sans-serif;font-weight:800;border-radius:10px}
.ldbtn i{font-style:normal;opacity:.8}
.ldlist{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:170px;background:#2b1d11;border:1px solid rgba(255,207,107,.45);border-radius:12px;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.5);flex-direction:column;gap:4px}
.ldrop.open .ldlist{display:flex}
.lditem{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;font-size:13px;font-family:'Be Vietnam Pro','Baloo 2','Cairo',sans-serif;font-weight:700;background:transparent;border:none;box-shadow:none;border-radius:8px;text-align:left}
.lditem:hover,.lditem.sel{background:rgba(255,209,102,.18);color:#ffd166}
.panel{scrollbar-width:thin;scrollbar-color:#c8a165 transparent}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-track{background:transparent;margin:14px 0}.panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ffd166,#c8a165);border-radius:6px}.panel::-webkit-scrollbar-button{display:none;height:0}
.grp{text-align:left;font-size:12px;font-weight:800;color:#e8d0a0;margin:10px 2px 2px;letter-spacing:.05em}
.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
@media (max-width:640px){.regions{grid-template-columns:repeat(3,1fr);gap:6px}.regions button{height:52px;font-size:10.5px}}
.regions button{padding:0;height:74px;border-radius:12px;overflow:hidden;position:relative;font-size:11.5px;color:#fff;text-shadow:0 1px 2px #000;display:flex;align-items:flex-end;justify-content:flex-start;border:2px solid rgba(255,255,255,.25)}
.regions button span{display:block;width:100%;text-align:left;padding:5px 7px;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0));line-height:1.15}
.regions button.sel{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.45)}
.regions button:disabled{opacity:1;filter:grayscale(.8) brightness(.55)}
.regions button i{position:absolute;top:5px;right:7px;font-style:normal;font-size:10px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:8px}
.scenes button.sel{background:linear-gradient(180deg,#ffe3a3,#e8b65a);color:#2a1406;border-color:#fff3d0}
.lbl{color:#e8d0a0;font-size:13px;margin-top:8px}
.tip{color:#e0c99a;font-size:12.5px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
td{padding:4px 8px;border-bottom:1px solid rgba(200,161,101,.25);text-align:left}
tr.me td{color:#ffd166;font-weight:800}
.big{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;font-size:clamp(30px,6vw,56px);margin:4px 0}
.up{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:rgba(26,15,6,.55);border-radius:12px;padding:10px 14px;margin:8px 0;text-align:left}
.bar{display:flex;gap:3px;margin-top:5px}.bar i{width:18px;height:7px;border-radius:3px;background:#4a3420}.bar i.on{background:#ffcf6b}
.money{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;color:#9cf08a;font-size:20px}
/* ===== controls ===== */
.tb{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;border-radius:50%;
 color:#fff;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.2),rgba(255,255,255,.04) 62%),rgba(22,15,9,.78);border:2px solid rgba(255,255,255,.28);
 box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .07s ease,background-color .07s,filter .07s;--c:#fff}
.tb svg{width:42%;height:42%;fill:currentColor;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.tb span{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.06em;line-height:1;margin-top:3px;text-shadow:0 1px 1px rgba(0,0,0,.6);white-space:nowrap}
.tb.on{transform:scale(.9);filter:brightness(1.35)}
.tb.act{border-color:var(--c);color:var(--c)}
.tb.act span{color:#fff;font-size:8.6px;letter-spacing:0;max-width:96%;line-height:1.35;white-space:nowrap}
.tb.tongue{--c:#ff7aa2}.tb.spit{--c:#6fd0ff}.tb.fart{--c:#b4e05a}.tb.brake{--c:#ff6b5b}
.tb.jump{--c:#ffd166;border-color:#ffe39a;color:#3a1e04;background:radial-gradient(circle at 50% 25%,#ffe8a8,#ffb437 60%,#e0841c);box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 -3px 0 rgba(120,50,0,.35)}
.tb.jump span{color:#3a1e04;text-shadow:none}
.tb.pill{border-radius:999px;flex-direction:row;gap:6px}.tb.pill svg{width:auto;height:52%}.tb.pill span{margin-top:0;font-size:11px}
.tb.steerb svg{width:46%;height:46%}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
body.touch.playing:not(.panel) #touch{display:block}
.tc{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6vh)}
#tl{left:calc(env(safe-area-inset-left) + 14px);display:flex;gap:12px}
#tl .tb{width:clamp(62px,17vmin,92px);height:clamp(62px,17vmin,92px)}
#tr{right:calc(env(safe-area-inset-right) + 14px);display:grid;grid-template-columns:repeat(3,auto);gap:10px;align-items:center;justify-items:center}
#tr .act{width:clamp(48px,12.5vmin,66px);height:clamp(48px,12.5vmin,66px)}
#tr .brake{width:clamp(48px,12.5vmin,66px);height:clamp(48px,12.5vmin,66px);border-radius:50%;flex-direction:column}
#tr .jump{grid-column:2/4;width:100%;height:clamp(52px,14vmin,72px)}
#tpause{position:fixed;top:calc(env(safe-area-inset-top) + 10vh);right:calc(env(safe-area-inset-right) + 14px);width:42px;height:42px;border-radius:12px}
/* portrait cockpit */
#cockpit{position:fixed;left:0;right:0;bottom:0;height:var(--ph);display:none;flex-direction:column;gap:8px;box-sizing:border-box;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);z-index:6;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px),linear-gradient(180deg,#2b1d11,#170e07);border-top:1px solid rgba(255,207,107,.35);box-shadow:0 -8px 24px rgba(0,0,0,.45)}
body.panel #cockpit{display:flex}
.dash{display:flex;align-items:center;gap:10px;height:50px}
.dial{--p:0;width:50px;height:50px;border-radius:50%;flex:none;background:conic-gradient(from -135deg,#ffb437 calc(var(--p)*270deg),rgba(255,255,255,.13) 0 270deg,transparent 0);display:grid;place-items:center}
.dial-in{width:40px;height:40px;border-radius:50%;background:#170e07;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dial-in b{font-family:'Bungee','Baloo 2','Cairo',Impact,sans-serif;font-weight:400;font-size:14px;color:#fff}.dial-in small{font-size:7px;color:#c9b08a;margin-top:2px}
.hpwrap{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.hplbl{display:flex;justify-content:space-between;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:800;font-size:10px;letter-spacing:.06em;color:#e8d0a0;white-space:nowrap;overflow:hidden}
.meter{height:9px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#6fd94f,#b6e35a);transition:width .15s}
.meter.low i{background:linear-gradient(90deg,#ff5b3b,#ff9f43)}
.meter.tgt{height:5px}.meter.tgt i{background:#ff9f43}
#cockpit .pause{width:40px;height:40px;border-radius:12px;flex:none}
.ctrls{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:0}
.steer{display:flex;gap:10px}
.steer .tb{width:min(20vw,86px);height:min(20vw,86px)}
.acts{display:grid;grid-template-columns:repeat(3,auto);gap:8px;align-items:center;justify-items:center}
.acts .act{width:min(14vw,58px);height:min(14vw,58px)}
.acts .brake{width:min(14vw,58px);height:min(14vw,58px)}
.acts .jump{grid-column:2/4;width:100%;height:min(14vw,58px)}
.touchonly{display:none}body.touch .touchonly{display:block}
@media (pointer:coarse){body.touch .keys,body.touch .keys+.tip{display:none}}
</style>
</head>
<body>
<div id="sa"></div>
<div id="wrap"><div id="stage"><canvas id="c"></canvas></div></div>
<div id="ov"></div>
<div id="touch">
 <div class="tc" id="tl"><div class="tb steerb" data-k="left"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg></div><div class="tb steerb" data-k="right"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg></div></div>
 <div class="tc" id="tr">
  <div class="tb act tongue" data-a="tongue"><svg viewBox="0 0 24 24"><path d="M3 8c3 2 15 2 18 0-1 4-4 6-9 6S4 12 3 8zm5.5 5.2h7v3.3a3.5 3.5 0 0 1-7 0z"/></svg><span data-i="bTongue">LƯỠI</span></div>
  <div class="tb act spit" data-a="spit"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4.6-6 8-6 11.6a6 6 0 0 0 12 0c0-3.6-3-7-6-11.6z"/></svg><span data-i="bSpit">NHỔ</span></div>
  <div class="tb act fart" data-a="fart"><svg viewBox="0 0 24 24"><path d="M7 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 9.1 4.5 4.5 0 0 1 17.5 19z"/><path d="M7 4.5c1 1-1 2 0 3M11 3c1 1-1 2 0 3M15 4.5c1 1-1 2 0 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span data-i="bFart">RẮM</span></div>
  <div class="tb act brake" data-k="down"><svg viewBox="0 0 24 24"><path d="M8.3 2.5h7.4l5.3 5.3v7.4l-5.3 5.3H8.3L3 15.2V7.8z"/><rect x="7" y="10.6" width="10" height="2.8" rx="1" fill="#1a0f06"/></svg><span data-i="bBrake">THẮNG</span></div>
  <div class="tb pill jump" data-a="jump"><svg viewBox="0 0 24 24"><path d="M12 3l7 7.5h-4.2V16H9.2v-5.5H5z"/><rect x="4" y="18.5" width="16" height="2.4" rx="1.2"/></svg><span data-i="bJump">NHẢY</span></div>
 </div>
 <div class="tb" id="tpause" data-a="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></div>
</div>
<div id="cockpit">
 <div class="dash">
  <div class="dial" id="cDial"><div class="dial-in"><b id="cSpd">0</b><small>KM/H</small></div></div>
  <div class="hpwrap">
   <div class="hplbl"><span data-i="hp">MÁU</span><span id="cTgtN"></span></div>
   <div class="meter" id="cHpB"><i id="cHp"></i></div>
   <div class="meter tgt" id="cTgB" style="visibility:hidden"><i id="cTg"></i></div>
  </div>
  <div class="tb pause" data-a="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></div>
 </div>
 <div class="ctrls">
  <div class="steer"><div class="tb steerb" data-k="left"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg></div><div class="tb steerb" data-k="right"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg></div></div>
  <div class="acts">
   <div class="tb act tongue" data-a="tongue"><svg viewBox="0 0 24 24"><path d="M3 8c3 2 15 2 18 0-1 4-4 6-9 6S4 12 3 8zm5.5 5.2h7v3.3a3.5 3.5 0 0 1-7 0z"/></svg><span data-i="bTongue">LƯỠI</span></div>
   <div class="tb act spit" data-a="spit"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4.6-6 8-6 11.6a6 6 0 0 0 12 0c0-3.6-3-7-6-11.6z"/></svg><span data-i="bSpit">NHỔ</span></div>
   <div class="tb act fart" data-a="fart"><svg viewBox="0 0 24 24"><path d="M7 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 9.1 4.5 4.5 0 0 1 17.5 19z"/><path d="M7 4.5c1 1-1 2 0 3M11 3c1 1-1 2 0 3M15 4.5c1 1-1 2 0 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span data-i="bFart">RẮM</span></div>
   <div class="tb act brake" data-k="down"><svg viewBox="0 0 24 24"><path d="M8.3 2.5h7.4l5.3 5.3v7.4l-5.3 5.3H8.3L3 15.2V7.8z"/><rect x="7" y="10.6" width="10" height="2.8" rx="1" fill="#1a0f06"/></svg><span data-i="bBrake">THẮNG</span></div>
   <div class="tb pill jump" data-a="jump"><svg viewBox="0 0 24 24"><path d="M12 3l7 7.5h-4.2V16H9.2v-5.5H5z"/><rect x="4" y="18.5" width="16" height="2.4" rx="1.2"/></svg><span data-i="bJump">NHẢY</span></div>
  </div>
 </div>
</div>
<script>
'use strict';
// ====== Constants ======
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),stage=document.getElementById('stage');
let ROADW=2000,LANES=3;const laneC=i=>-1+(2*i+1)/LANES;
let W=960,H=540,F=480,FY=270,HZ=270,CAMH=1000,PANEL=false;
const SEG=200,RUMBLE=3,FOV=100,DRAW=260,FOGD=2.6,STEP=1/60;
const CAMD=1/Math.tan(FOV/2*Math.PI/180),PLAYERZ=1000*CAMD,BASEMAX=SEG/STEP*.68,CENTRIF=0.24;
const FONT="'Bungee','Baloo 2','Cairo','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Impact,sans-serif";

// ====== Utils ======
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p;
const easeIn=(a,b,p)=>a+(b-a)*p*p,easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5);
const expFog=(d,den)=>1/Math.pow(Math.E,d*d*den);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)];
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)));else ctx.rect(x,y,w,h);ctx.fill()}
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fill()}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill()}
function ell(x,y,rx,ry,c,rot){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,Math.PI*2);ctx.fill()}

function addRoad(e,h,l,curve,height){const sy=lastY(),ey=sy+height*SEG,t=e+h+l;let i;
 for(i=0;i<e;i++)addSegment(easeIn(0,curve,i/e),easeInOut(sy,ey,i/t));
 for(i=0;i<h;i++)addSegment(curve,easeInOut(sy,ey,(e+i)/t));
 for(i=0;i<l;i++)addSegment(easeInOut(curve,0,i/l),easeInOut(sy,ey,(e+h+i)/t));}
function genHeights(r,n,a,b){const hs=[];for(let i=0;i<n;i++)hs.push(a+r()*(b-a));hs.push(hs[0]);return hs}

 const VW=420,VH=150,pad=20,sc=Math.min((VW-pad*2)/Math.max(1,x1-x0),(VH-pad*2)/Math.max(1,y1-y0)),ox=(VW-(x1-x0)*sc)/2,oy=(VH-(y1-y0)*sc)/2;
 const P2=pts.map(([px,py])=>[(px-x0)*sc+ox,(py-y0)*sc+oy]),d='M'+P2.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
 const rn=mulberry32(S.scene*31+S.level),dots=[];for(let i=2;i<P2.length-2;i+=3){const [ax,ay]=P2[i],[bx,by]=P2[i+1],dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,sd=rn()<.5?-1:1,off=10+rn()*14;dots.push(`<circle cx="${(ax-dy/len*off*sd).toFixed(1)}" cy="${(ay+dx/len*off*sd).toFixed(1)}" r="${(2.5+rn()*3).toFixed(1)}" fill="${R.near}" opacity=".85"/>`)}
 const [sx,sy]=P2[0],[fx,fy]=P2[P2.length-1];
 return `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${R.grass[0]}"/><stop offset="1" stop-color="${R.far}"/></linearGradient><pattern id="chk" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#111"/><rect x="2" y="2" width="2" height="2" fill="#111"/></pattern></defs>
 ${dots.join('')}
 <path d="${d}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 3)"/>
 <path d="${d}" fill="none" stroke="${R.rumble[0]}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="${d}" fill="none" stroke="${R.road[0]}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="${d}" fill="none" stroke="${R.lane}" stroke-width="1.2" stroke-dasharray="4 4"/>
 <circle cx="${sx}" cy="${sy}" r="8" fill="#58d36b" stroke="#fff" stroke-width="2"/><circle cx="${sx-3}" cy="${sy-2}" r="2.2" fill="#fff"/><circle cx="${sx+3}" cy="${sy-2}" r="2.2" fill="#fff"/><circle cx="${sx-3}" cy="${sy-2}" r="1" fill="#111"/><circle cx="${sx+3}" cy="${sy-2}" r="1" fill="#111"/>
 <line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy-20}" stroke="#eee" stroke-width="1.6"/><rect x="${fx}" y="${fy-20}" width="13" height="9" fill="url(#chk)" stroke="#111" stroke-width=".6"/></svg>`}
let reRender=null;
function langDrop(){const cur=LANGS.find(q=>q[0]===S.lang)||LANGS[0];return `<div class="ltop"><div class="ldrop" id="ldrop"><button class="ldbtn" id="ldbtn"><span class="flag">${FLAGS[cur[0]]}</span><span>${cur[1]}</span><i>▾</i></button><div class="ldlist">${LANGS.map(([c,n])=>`<button class="lditem ${c===S.lang?'sel':''}" data-l="${c}"><span class="flag">${FLAGS[c]}</span>${n}</button>`).join('')}</div></div></div>`}
function wireLang(){const d=document.getElementById('ldrop');if(!d)return;document.getElementById('ldbtn').onclick=e=>{e.stopPropagation();d.classList.toggle('open')};
 d.querySelectorAll('.lditem').forEach(it=>it.onclick=e=>{e.stopPropagation();S.lang=it.dataset.l;save();applyLang();if(reRender)reRender()})}
document.addEventListener('click',()=>{const d=document.getElementById('ldrop');if(d)d.classList.remove('open')});
function showMenu(){mode='menu';paused=false;applyLang();buildTrack(S.level);position=0;P={x:0,z:PLAYERZ,speed:0,maxSpeed:BASEMAX};opps=[];cars=[];cop={state:'rest'};reRender=showMenu;
 const l=L(),lg=LANGS.map(([c,n])=>`<button id="lg_${c}" class="lgb ${c===S.lang?'sel':''}"><span class="flag">${FLAGS[c]}</span>${n}</button>`).join('');
 const b={bS:startRace,bG:showShop,bMapCard:showMap,bR:()=>{if(ovConfirm()){S={money:0,level:0,engine:0,tires:0,armor:0,scene:S.scene,lang:S.lang,shellsAll:0};save();showMenu()}},__primary:startRace};
 LANGS.forEach(([c])=>b['lg_'+c]=()=>{S.lang=c;save();showMenu()});
 showOv(`<div class="panel"><h1>${l.title}</h1><div class="sub">${l.sub}</div>
 <div class="info">${l.info(S.level+1,l.scenes[S.scene],sò(S.money),(raceLen*5.1e-6).toFixed(1))}</div>
 <div class="tip" style="margin:2px 0 6px;color:#ffd166">${l.allShells}: <b>${S.shellsAll||0}</b></div><div class="lbl">${l.curMap}</div><button class="trackcard" id="bMapCard" style="background:linear-gradient(180deg,${SCENES[S.scene].grass[0]},${SCENES[S.scene].far})">${trackSVG()}<span class="tcname"><b>${l.regions[S.scene]}</b><small>${l.roadDesc[S.scene]}</small></span><span class="tctap">${l.tapMap} ›</span></button>
 <div class="btns"><button class="pri" id="bS">${l.race}</button><button id="bG">${l.garage}</button><button id="bR">${l.reset}</button></div>
 <div class="lbl">${l.lang}</div><div class="scenes">${lg}</div>${keyHelp()}
 <p class="tip">${l.menuTip}</p></div>`,b)}
function showMap(keepScroll){const l=L(),pan=ov.querySelector('.panel'),st=keepScroll&&pan?pan.scrollTop:0;reRender=()=>showMap(true);
 const sc=GROUPS.map((g,gi)=>`<div class="grp">${l.groups[gi]}</div><div class="regions">${Array.from({length:g[1]-g[0]},(_,j)=>mapCard(g[0]+j)).join('')}</div>`).join('');
 const b={bS:startRace,bB:showMenu,__primary:startRace};SCENES.forEach((s2,i)=>b['sc'+i]=()=>{S.scene=i;save();buildTrack(S.level);position=0;showMap(true)});
 showOv(`<div class="panel mapwin">${langDrop()}<h2>${l.worldMap}</h2><div class="info"><b>${l.regions[S.scene]}</b> · ${l.roadDesc[S.scene]}</div>
 <div class="btns"><button class="pri" id="bS">${l.race}</button><button id="bB">${l.back}</button></div>${sc}</div>`,b);
 const np=ov.querySelector('.panel');if(np&&st)np.scrollTop=st}
let confirmArm=0;function ovConfirm(){const now=Date.now();if(now-confirmArm<2500)return true;confirmArm=now;const b=document.getElementById('bR');if(b)b.textContent=L().resetConfirm;return false}
const UPS=[{k:'engine',max:5,c:l=>600*(l+1)},{k:'tires',max:4,c:l=>450*(l+1)},{k:'armor',max:4,c:l=>450*(l+1)}];
function showShop(){const L_=L();reRender=showShop;
 const rows=UPS.map((u,ui)=>{const l=S[u.k],full=l>=u.max,cost=u.c(l);return `<div class="up"><div><b>${L_.ups[ui][0]}</b><div style="color:#e0c99a;font-size:12px">${L_.ups[ui][1]}</div><div class="bar">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div><div class="money" style="font-size:15px">${full?L_.max:sò(cost)}</div><button id="u_${u.k}" ${full||S.money<cost?'disabled':''}>${L_.buy}</button></div>`}).join('');
 const b={bB:showMenu,bS:startRace,__primary:startRace};UPS.forEach(u=>b['u_'+u.k]=()=>{const c=u.c(S[u.k]);if(S.money>=c&&S[u.k]<u.max){S.money-=c;S[u.k]++;save();showShop()}});
 showOv(`<div class="panel">${langDrop()}<h2>${L_.garage}</h2><div class="money">${sò(S.money)}</div>${rows}<div class="btns"><button id="bB">${L_.back}</button><button class="pri" id="bS">${L_.go}</button></div></div>`,b)}
let lastRes=null;
function endRace(type){
 mode='result';pendingEnd=null;let earn=0,qual=false;
 const order=[...finishOrder].map((o,i)=>({ri:RIVALS.indexOf(o.look)}));const rest=opps.filter(o=>!o.isCop&&!o.finished);
 if(type==='finish'){order.splice(P.place-1,0,{me:true});rest.sort((a,b)=>b.z-a.z);order.push(...rest.map(o=>({ri:RIVALS.indexOf(o.look)})))}
 const bonus=P.kos*150+P.copKos*300+(P.fly||0)*50+(P.shellsGot||0)*10-(P.pen||0);
 if(type==='finish'){earn=PRIZE[P.place-1]+bonus;qual=P.place<=3}else earn=bonus;
 let next=-1;if(qual){S.level++;S.scene=(S.scene+1)%SCENES.length;next=S.scene}
S.shellsAll=(S.shellsAll||0)+(P.shellsGot||0); S.money=Math.max(0,S.money+earn);save();
 lastRes={type,earn,qual,next,order,place:P.place,time:P.time,kos:P.kos,copKos:P.copKos,pen:P.pen||0,shells:P.shellsGot||0};showResult()}
function showResult(){const r=lastRes,l=L();reRender=showResult;
 const title=r.type==='finish'?(r.place===1?l.champ:l.placeT(r.place)):l.wrecked,sub=r.type==='finish'?(r.qual?l.qual:l.noqual):'';
 const tbl=r.type==='finish'?'<table>'+r.order.map((o,i)=>`<tr class="${o.me?'me':''}"><td>${i+1}</td><td>${o.me?l.you:l.riders[o.ri]}</td><td style="text-align:right">${PRIZE[i]?sò(PRIZE[i]):''}</td></tr>`).join('')+'</table>':'';
 showOv(`<div class="panel">${langDrop()}<div class="big" style="color:${r.type==='finish'?'#ffd166':'#ff7b6b'}">${title}</div><div class="sub">${sub}</div>${r.next>=0?`<div class="info" style="color:#ffd166;font-weight:800">→ ${l.regions[r.next]}</div>`:''}
 <div class="info">${l.time}: <b>${r.type==='finish'?fmtT(r.time):'—'}</b> · ${l.shellsLbl}: <b style="color:#ffd166">${r.shells||0}</b> (${l.allShells}: ${S.shellsAll||0}) · ${l.kos}: <b>${r.kos}</b>${r.copKos?' · '+l.copKos+': <b>'+r.copKos+'</b>':''}${r.pen?' · '+l.penalty+': <b style="color:#ff7b6b">-'+sò(r.pen)+'</b>':''} · ${r.earn>=0?l.earn:l.lose}: <b style="color:${r.earn>=0?'#9cf08a':'#ff7b6b'}">${sò(Math.abs(r.earn))}</b></div>${tbl}
 <div class="btns"><button class="pri" id="bN">${r.qual?l.next:l.retry}</button><button id="bG">${l.garage}</button><button id="bM">${l.menu}</button></div></div>`,{bN:startRace,bG:showShop,bM:showMenu,__primary:startRace})}
function showPause(){const l=L();reRender=showPause;showOv(`<div class="panel">${langDrop()}<h2>${l.paused}</h2>${keyHelp()}<div class="btns"><button class="pri" id="bC">${l.resume}</button><button id="bQ">${l.quit}</button></div></div>`,{bC:togglePause,bQ:showMenu,__primary:togglePause})}
function togglePause(){if(mode!=='race'&&mode!=='countdown')return;paused=!paused;
 if(paused){if(P.charging){P.charging=false;P.charge=0}showPause()}else hideOv()}

// ====== Input ======
document.querySelectorAll('.tb[data-k],.tb[data-a]').forEach(el=>{const k=el.dataset.k,a=el.dataset.a;
 const down=e=>{e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();autoGas=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}
  if(k)keys[k]=true;else if(a==='tongue')playerAttack('tongue');else if(a==='spit')playerSpit();else if(a==='fart')startCharge();else if(a==='jump')playerJump();else if(a==='pause')togglePause()};
 const up=()=>{el.classList.remove('on');if(k)keys[k]=false;else if(a==='fart')releaseFart()};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);el.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('pointerdown',()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume()});
const KEYMAP={KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
addEventListener('keydown',e=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();if(e.code==='KeyW'||e.code==='ArrowUp'||e.code==='KeyA'||e.code==='KeyD')autoGas=false;
 const overlay=ov.className!=='hide';
 if((e.code==='Enter'||(e.code==='Space'&&overlay))&&!e.repeat){e.preventDefault();if(overlay&&primary)primary();return}
 if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=true;e.preventDefault()}
 if(e.repeat)return;
 if(e.code==='Space'){playerJump();e.preventDefault()}
 else if(e.code==='KeyO'){playerAttack('tongue');e.preventDefault()}
 else if(e.code==='KeyP'){playerSpit();e.preventDefault()}
 else if(e.code==='KeyL'){startCharge();e.preventDefault()}
 else if(e.code==='Escape')togglePause();
 else if(e.code==='KeyM')muted=!muted;
});
addEventListener('keyup',e=>{if(e.code==='KeyL')releaseFart();if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=false;e.preventDefault()}});
addEventListener('blur',()=>{if(P.charging){P.charging=false;P.charge=0}for(const k in keys)keys[k]=false;if(mode==='race'&&!paused)togglePause()});

// ====== Loop ======
let last=performance.now(),acc=0,playingCls=null;
function frame(now){const d=Math.min(.1,(now-last)/1000);last=now;acc+=d;while(acc>=STEP){update(STEP);acc-=STEP}
 if(mode==='menu'||mode==='result'){position+=BASEMAX*.25*d;if(position>raceLen)position=0;P.z=position+PLAYERZ;const s=findSeg(P.z);bg1+=s.curve*(BASEMAX*.25*d/SEG)*.0006;bg2+=s.curve*(BASEMAX*.25*d/SEG)*.0013}
 render();engineUpdate();updateCockpit();
 const pl=(mode==='race'||mode==='countdown')&&!paused;if(pl!==playingCls){playingCls=pl;document.body.classList.toggle('playing',pl)}
 requestAnimationFrame(frame)}
layout();showMenu();requestAnimationFrame(frame);
</script>
